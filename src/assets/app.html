<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16161e">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<title>amux</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header id="top"><b>amux</b><span id="summary"></span><span id="live" title="live updates"></span></header>

<!-- Runs: by space (repo) or by state -->
<section id="tab-runs" class="tab">
  <div class="seg" id="runs-view">
    <button data-v="spaces" class="on">Spaces</button><button data-v="board">Board</button>
  </div>
  <input id="filter" type="search" placeholder="Filter runs, branches, folders…">
  <div id="list"></div>
</section>

<!-- New run -->
<section id="tab-new" class="tab" hidden>
  <form id="new">
    <label>Account<select id="n-account" required></select></label>
    <label>Machine<select id="n-machine"></select></label>
    <label>Folder<input id="n-dir" list="n-dirs" placeholder="~/src/app" autocomplete="off"><datalist id="n-dirs"></datalist></label>
    <label class="row"><input type="checkbox" id="n-worktree" checked> Own git worktree and branch</label>
    <label id="n-branch-l">Branch<input id="n-branch" placeholder="amux/&lt;run&gt;" autocomplete="off"></label>
    <label>Name<input id="n-name" placeholder="optional" autocomplete="off"></label>
    <label>Prompt<textarea id="n-prompt" rows="5" placeholder="What should the agent do?"></textarea></label>
    <button class="primary">Start run</button>
    <p id="n-out" class="note"></p>
  </form>
</section>

<!-- Machine load, slots, machines -->
<section id="tab-monitor" class="tab" hidden>
  <div id="monitor"></div>
</section>

<!-- One run -->
<section id="run" hidden>
  <nav><button id="back">‹</button><div id="title"><b id="r-id"></b><span id="r-sub"></span></div><span id="r-state"></span></nav>
  <div id="reason"></div>
  <div class="seg" id="run-view">
    <button data-v="screen" class="on">Screen</button><button data-v="changes">Changes</button><button data-v="ship">Ship</button>
  </div>
  <div id="v-screen" class="view">
    <pre id="screen"></pre>
    <div id="keys">
      <button data-key="y">Yes</button><button data-key="n">No</button>
      <button data-key="enter">⏎</button><button data-key="esc">Esc</button>
      <button data-key="up">↑</button><button data-key="down">↓</button>
      <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
      <button data-key="tab">Tab</button><button data-key="ctrl-c">^C</button>
    </div>
    <form id="send"><textarea id="text" rows="2" placeholder="Reply to the agent…"></textarea><button class="primary">Send</button></form>
  </div>
  <div id="v-changes" class="view" hidden>
    <div class="bar"><span id="c-count" class="note"></span><button id="c-send" class="primary">Send comments</button></div>
    <div id="diff"></div>
  </div>
  <div id="v-ship" class="view" hidden>
    <h2>Check</h2>
    <pre id="plan" class="text"></pre>
    <div class="buttons">
      <button data-act="test">Run tests here</button>
      <button data-act="push">Push for CI</button>
      <button data-act="send-failures">Send test failures</button>
    </div>
    <div class="buttons"><button data-act="land">Land into its branch</button></div>
    <h2>Pull request</h2>
    <pre id="checks" class="text"></pre>
    <div class="buttons">
      <button data-act="pr">Open PR</button>
      <button data-act="pr-draft">Open draft PR</button>
      <button data-act="checks-send">Send failing CI</button>
    </div>
    <h2>Run</h2>
    <div class="buttons">
      <button data-act="revive">Revive (after a restart)</button>
      <button data-act="failover">Move to another account</button>
      <button data-act="stop" class="danger">Stop</button>
      <button data-act="rm" class="danger">Remove</button>
    </div>
    <p id="ship-out" class="note"></p>
  </div>
</section>

<footer id="tabs">
  <button data-tab="runs" class="on">Runs</button>
  <button data-tab="new">New</button>
  <button data-tab="monitor">Monitor</button>
</footer>
<script src="/app.js"></script>
</body>
</html>
