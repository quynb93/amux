[package]
name = "amux"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Run Claude Code, Codex and Gemini CLI with many accounts over one shared home"
license = "MIT"
repository = "https://github.com/quynb93/amux"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
ureq = "2"
url = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
