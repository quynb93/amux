[package]
name = "amux"
version = "0.11.6"
edition = "2021"
rust-version = "1.88"
description = "Run Claude Code, Codex and Gemini CLI with many accounts over one shared home"
license = "MIT"
repository = "https://github.com/quynb93/amux"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
ureq = "2"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# `amux serve --tls`: the same TLS library ureq already uses.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
# `amux ui`: the TUI, and a terminal emulator for the live preview of a run.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
vt100 = "0.18"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
