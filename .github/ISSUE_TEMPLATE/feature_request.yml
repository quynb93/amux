name: Feature request or new provider
description: Suggest an improvement, or support for another CLI
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or workflow, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: provider
    attributes:
      label: For a new CLI
      description: Its home directory, the variable that moves it, where it stores the login, and where it writes sessions. Link the docs or source if you can.
