name: Bug report
description: Something in amux doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please don't paste tokens, `.claude.json` contents or session transcripts. For security problems, use [private reporting](https://github.com/quynb93/amux/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. amux account add claude test --no-login
        2. amux claude@test
        3. …
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `amux --version` and `amux doctor`
      render: text
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS, how you installed amux, and the CLI and version involved
      placeholder: macOS 15.2, Homebrew, Claude Code 2.1.0
    validations:
      required: true
