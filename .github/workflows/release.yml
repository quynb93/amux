name: Release

# Push a tag like v0.2.0 to publish a GitHub release. The tag must match
# "version" in package.json, and CHANGELOG.md must have a "## [0.2.0]" section.
#
# Optional repo secrets turn on more channels; without them those steps are skipped:
#   TAP_DEPLOY_KEY  SSH deploy key with write access to quynb93/homebrew-tap
#   NPM_TOKEN       npm automation token that can publish @quynb/amux
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check the tag matches package.json
        run: |
          pkg="v$(node -p 'require("./package.json").version')"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for [$version]"
            exit 1
          fi

      # Users install this prebuilt package, so nothing has to compile on their machine.
      - name: Build the package
        run: |
          npm pack
          mv quynb-amux-*.tgz amux.tgz

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" amux.tgz --title "amux $GITHUB_REF_NAME" --notes-file notes.md --verify-tag

      - name: Update the Homebrew tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "::notice::TAP_DEPLOY_KEY is not set; skipping the Homebrew tap update"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          sha="$(sha256sum amux.tgz | cut -d' ' -f1)"
          key="$RUNNER_TEMP/tap_key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$TAP_DEPLOY_KEY" > "$key")
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:quynb93/homebrew-tap.git "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          sed -i -E \
            -e "s#^(  url \").*(\")#\1https://github.com/quynb93/amux/releases/download/v${version}/amux.tgz\2#" \
            -e "s#^(  sha256 \").*(\")#\1${sha}\2#" \
            Formula/amux.rb
          if ! grep -qF "releases/download/v${version}/amux.tgz" Formula/amux.rb || ! grep -qF "\"${sha}\"" Formula/amux.rb; then
            echo "::error::Formula/amux.rb has no url or sha256 line in the expected format"
            exit 1
          fi
          if git diff --quiet; then
            echo "::notice::The Homebrew formula is already at ${version}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "amux ${version}"
          git push

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_TOKEN is not set; skipping npm publish"
            exit 0
          fi
          # Publish the same tarball the GitHub release and Homebrew use, instead of rebuilding it.
          npm publish amux.tgz --provenance --access public
